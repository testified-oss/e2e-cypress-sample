name: Lint & Test
on: [push, pull_request]
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Ensure Bun is in PATH
      run: |
        export PATH="$HOME/.bun/bin:$PATH"
        bun --version
    - run: bun install --force
    - run: bun x cypress@15.20.0 run
    - run: npm run lint
